[project]
name = "self-improving-agent"
version = "0.3.0"
description = "Self-improving browser and desktop automation agent (LangGraph engine, semantic memory, LLM reflection)"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # WebSocket
    "websockets>=14.0",

    # Browser automation
    "playwright>=1.49.0",

    # Agent engine (LangGraph + LiteLLM tool calling)
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "litellm>=1.70.0",

    # Level 3 learning (local semantic memory)
    "chromadb>=1.0.0",
    "onnxruntime>=1.17.0",

    # Configuration
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",

    # Database (SQLite)
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",

    # Utilities
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "psutil>=5.9.0",
    "pillow>=10.0.0",

    # Reading documents (read_file: pdf, docx, pptx, xlsx) — as in requirements.txt
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",

    # Voice
    "SpeechRecognition>=3.10.0",
    "PyAudio>=0.2.14",
]

[project.optional-dependencies]
offline-wake-word = [
    "vosk>=0.3.45",
]
desktop = [
    "pywebview>=5.0",
    "pystray>=0.19",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
